[project]
name = "ediarum-fileservice"
version = "0.1.2"
description = "Keeps each project's XML on the shared mount in step with webdav and git."
readme = "README.md"
authors = [
    { name = "Malte Vogl", email = "telota@bbaw.de" }
]
requires-python = ">=3.13"
dependencies = [
    "ediarum-sdk>=0.3,<0.4",
    "fastapi>=0.142.1",
    "httpx2>=2.13.1",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.47",
    "uvicorn>=0.54.0",
]

[project.scripts]
ediarum-fileservice = "ediarum_fileservice:main"
ediarum-fileservice-create-key = "ediarum_fileservice.keys:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
docs = [
    "mkdocs-material>=9.8.0",
    "mkdocstrings[python]>=1.0.8",
]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["ediarum_fileservice"]
